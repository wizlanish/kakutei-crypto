[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kakutei-crypto"
version = "0.1.0"
description = "日本の暗号資産の雑所得を、総平均法・移動平均法でローカル計算する"
requires-python = ">=3.11"
authors = [{name = "wizlanish"}]
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kakutei = "kakutei_crypto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
